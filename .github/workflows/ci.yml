# الفحوصُ تعمل على GitHub، لا على جهازٍ واحدٍ فقط.
#
# 🔴 **قبل هذا الملفّ لم يكن في المستودع أيُّ CI إطلاقًا** (مقيسًا: لا
# `.github/workflows` ولا أيُّ إعدادٍ آخر). فـ٢٤٢٤ فحصًا كانت تعمل **حيث
# يشغّلها إنسان** فقط.
#
# ⚠️ **والعلامةُ الخضراءُ التي كانت تظهر على الـPR فخّ:** هي بناءُ Vercel —
# **«بُني ومرّ ESLint»، لا «الفحوصُ نجحت».** وكلُّ حارسٍ بنيناه لا يمرّ في ذلك
# البناء.
#
# ⚠️ **ولا أسرارَ لازمة، وهذا مقيسٌ لا مفترَض:** شُغّلت الحزمةُ كاملةً وقد
# نُزع `NEXT_PUBLIC_SUPABASE_URL` و`NEXT_PUBLIC_SUPABASE_KEY` ⟵ **٢٤٢٤ ✓ /
# ١١٦.** الفحوصُ تقرأ الشجرةَ لا القاعدة.
#
# 🔴 **ونسخةُ Node لا تُكتب هنا — تُقرأ من `.nvmrc`.** وهذا السطرُ ثمنُ درسٍ
# دُفع كاملًا: **كان مكتوبًا في هذا الموضع بالضبط «مخاطرةٌ صغيرةٌ تُقال: أخضرُ
# هنا بنسخةٍ وكسرٌ هناك بأخرى»** — ثمّ ثُبِّت الرقمُ `20` بيدٍ في السطر أسفله،
# **فوقعت المخاطرةُ نفسُها في الإيداع الذي أعلنها.**
#
# **والحصيلةُ مقيسةٌ لا مستنتَجة: أربعون تشغيلًا، أربعون فشلًا، من أوّل تشغيل.**
# والسببُ من السجلّ الحيّ لا من الظنّ:
#
# ```
# @supabase/supabase-js@2.110.8 · engines: { node: '>=22.0.0' }
# RealtimeClient ⟵ WebSocketFactory.getWebSocketConstructor()  ← عند الإنشاء لا عند الاستعمال
# «Node.js detected but native WebSocket not found … Ensure you are running Node.js 22+»
# ```
#
# ⇒ **فـ`lib/supabaseClient.js` يرمي وقتَ التحميل تحت Node 20**، وكلُّ ملفٍّ
# يستورده — **ثلاثةٌ وستّون** — يسقط قبل أن يُنفَّذ فيه فحصٌ واحد.
#
# ⚠️ **ولم يظهر محلّيًّا لأن المحلّيَّ `v24.18.0`، و«البيئةُ النظيفة» التي
# جُرِّبت لم تثبّت نسخةَ Node أصلًا** — فأعادت قياسَ الجهاز نفسِه.
#
# ⇒ **والسدُّ بنيويٌّ لا رقمٌ يُصحَّح: `node-version-file` تقرأ `.nvmrc`**،
# فالموضعُ واحدٌ لـnvm ولـCI معًا، **و«رقمان يفترقان» تصير غيرَ ممكنة لا
# منتبَهًا لها.** و`engines.node` في `package.json` تقولها لـVercel ولـnpm.
#
# **و`next build` ليس هنا عمدًا:** Vercel يشغّله على كلّ دفعةٍ أصلًا،
# **فتكرارُه يضاعف الزمنَ ولا يضيف إشارة.** والناقصُ كان الفحوص.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    name: الفحوص
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔴 **`node-version-file` لا `node-version`** — الرقمُ في `.nvmrc` وحدَه.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # ⚠️ **والنسخةُ الفعليّةُ تُطبع، فلا يُقرأ الأخضرُ عن نسخةٍ لم تُقَس.**
      - run: node --version

      # ⚠️ `npm ci` لا `npm install` — يقرأ `package-lock.json` حرفيًّا
      # (١٢٣٣٦ سطرًا، مقيسًا موجودًا) **فلا تتبدّل نسخةُ حزمةٍ بين جهازٍ وآخر.**
      - run: npm ci

      # 🔴 **والخطّافُ المحلّيُّ لا يغني عن هذا:** `.githooks/pre-commit` يرفض
      # الإيداعَ على حقنٍ معلَّق، **و`--no-verify` يتخطّاه ولا شيءَ يمنعه.**
      # وهذا لا يُتخطّى.
      - run: npx jest --ci
