# الفحوصُ تعمل على GitHub، لا على جهازٍ واحدٍ فقط.
#
# 🔴 **قبل هذا الملفّ لم يكن في المستودع أيُّ CI إطلاقًا** (مقيسًا: لا
# `.github/workflows` ولا أيُّ إعدادٍ آخر). فـ٢٤٢٤ فحصًا كانت تعمل **حيث
# يشغّلها إنسان** فقط.
#
# ⚠️ **والعلامةُ الخضراءُ التي كانت تظهر على الـPR فخّ:** هي بناءُ Vercel —
# **«بُني ومرّ ESLint»، لا «الفحوصُ نجحت».** وكلُّ حارسٍ بنيناه لا يمرّ في ذلك
# البناء.
#
# ⚠️ **ولا أسرارَ لازمة، وهذا مقيسٌ لا مفترَض:** شُغّلت الحزمةُ كاملةً وقد
# نُزع `NEXT_PUBLIC_SUPABASE_URL` و`NEXT_PUBLIC_SUPABASE_KEY` ⟵ **٢٤٢٤ ✓ /
# ١١٦.** الفحوصُ تقرأ الشجرةَ لا القاعدة.
#
# 🔴 **ونسخةُ Node مثبَّتةٌ هنا لأنها لم تكن مثبَّتةً في أيّ مكان** — لا
# `.nvmrc` ولا `engines`. **والمحلّيّةُ `v24`، ونسخةُ Vercel لم أستطع قياسَها.**
# ⇒ **فمخاطرةٌ صغيرةٌ تُقال: أخضرُ هنا بنسخةٍ وكسرٌ هناك بأخرى.** وسدُّها
# النهائيُّ `.nvmrc` تقرأه الثلاثةُ من موضعٍ واحد — **بندٌ مقترَحٌ لا منفَّذ.**
#
# **و`next build` ليس هنا عمدًا:** Vercel يشغّله على كلّ دفعةٍ أصلًا،
# **فتكرارُه يضاعف الزمنَ ولا يضيف إشارة.** والناقصُ كان الفحوص.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    name: الفحوص
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ⚠️ `npm ci` لا `npm install` — يقرأ `package-lock.json` حرفيًّا
      # (١٢٣٣٦ سطرًا، مقيسًا موجودًا) **فلا تتبدّل نسخةُ حزمةٍ بين جهازٍ وآخر.**
      - run: npm ci

      # 🔴 **والخطّافُ المحلّيُّ لا يغني عن هذا:** `.githooks/pre-commit` يرفض
      # الإيداعَ على حقنٍ معلَّق، **و`--no-verify` يتخطّاه ولا شيءَ يمنعه.**
      # وهذا لا يُتخطّى.
      - run: npx jest --ci
